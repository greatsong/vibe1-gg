<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학생들의 소감 — On AI와 Non AI 사이에서</title>
<style>
  :root{
    --bg:#0A0A0B; --ink:#F4F4F2; --ink-dim:#9A9A98; --ink-faint:#5A5A5C;
    --amber:#F3B03A; --cyan:#5AD6E6;
    --green:#5BE38B; --red:#FF7A6B; --yellow:#F3C34A;
    --ease:cubic-bezier(.22,.61,.36,1);
    --font:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
           "Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.035), transparent 60%),
      radial-gradient(80% 50% at 12% 100%, rgba(91,227,139,.05), transparent 55%),
      radial-gradient(80% 50% at 88% 100%, rgba(255,122,107,.05), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
    word-break:keep-all; overflow-wrap:break-word;
  }
  header{
    max-width:1280px; margin:0 auto; padding:72px 32px 8px;
    text-align:center;
  }
  .kicker{
    font-size:13px; font-weight:500; letter-spacing:.42em; padding-left:.42em;
    text-transform:uppercase; color:var(--ink-faint); margin-bottom:22px;
  }
  h1{ font-size:clamp(34px,5vw,56px); font-weight:800; letter-spacing:-.03em; line-height:1.12; }
  h1 .green{ color:var(--green); } h1 .red{ color:var(--red); }
  .sub{ margin-top:16px; color:var(--ink-dim); font-size:clamp(15px,1.6vw,18px); line-height:1.6; }
  nav{
    position:sticky; top:0; z-index:10;
    display:flex; justify-content:center; gap:10px;
    padding:18px 16px;
    background:linear-gradient(var(--bg) 72%, transparent);
  }
  nav button{
    font:inherit; font-size:15px; font-weight:600; letter-spacing:-.01em;
    color:var(--ink-dim); background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1); border-radius:999px;
    padding:9px 20px; cursor:pointer;
    transition:color .25s var(--ease), border-color .25s var(--ease), background .25s var(--ease);
  }
  nav button:hover{ color:var(--ink); }
  nav button[aria-pressed="true"]{ color:var(--bg); background:var(--ink); border-color:var(--ink); }
  nav button.b-on[aria-pressed="true"]{ background:var(--green); border-color:var(--green); }
  nav button.b-non[aria-pressed="true"]{ background:var(--red); border-color:var(--red); }
  nav .n{ opacity:.65; font-weight:500; margin-left:.35em; font-size:.85em; }
  main{
    max-width:1280px; margin:0 auto; padding:16px 32px 40px;
    columns:3 340px; column-gap:18px;
  }
  .quote{
    break-inside:avoid; margin:0 0 18px;
    padding:20px 22px; border-radius:14px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.09);
    border-top:2.5px solid var(--ink-faint);
  }
  .quote.on{ border-top-color:var(--green); }
  .quote.non{ border-top-color:var(--red); }
  .quote[hidden]{ display:none; }
  .quote figcaption{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .pill{
    font-size:11.5px; font-weight:800; letter-spacing:.08em;
    padding:3px 10px; border-radius:999px;
  }
  .on .pill{ color:var(--green); background:rgba(91,227,139,.12); }
  .non .pill{ color:var(--red); background:rgba(255,122,107,.12); }
  .badge{ font-size:12.5px; color:var(--ink-faint); letter-spacing:.02em; }
  blockquote{ font-size:15.5px; line-height:1.72; color:var(--ink); opacity:.92; }
  footer{
    max-width:1280px; margin:0 auto; padding:8px 32px 80px;
    text-align:center; color:var(--ink-faint); font-size:13.5px; line-height:1.8;
  }
  footer a{ color:var(--ink-dim); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="kicker">2026 수업 나눔 · 학생들의 목소리</div>
  <h1><span class="green">On AI</span>와 <span class="red">Non AI</span>,<br>학생들의 소감</h1>
  <p class="sub">인공지능 기초 데이터 분석 프로젝트(On AI · 바이브 코딩)와<br>
  VPython 프로젝트(Non AI · 손 코딩)를 마친 당곡고 학생들이 남긴 말들입니다.</p>
</header>

<nav aria-label="소감 필터">
  <button type="button" data-f="all" aria-pressed="true">전체<span class="n">193</span></button>
  <button type="button" class="b-on" data-f="on" aria-pressed="false">On AI<span class="n">100</span></button>
  <button type="button" class="b-non" data-f="non" aria-pressed="false">Non AI<span class="n">93</span></button>
</nav>

<main id="grid">
    <figure class="quote on" data-g="on">
      <figcaption><span class="pill">On AI</span><span class="badge">AI를 쓰며 느낀 것</span></figcaption>
      <blockquote>AI가 생각보다 원하는 느낌으로 코드를 짜는것이 아니여서 조금 어려웠지만 이번기회로 AI를 활용하여 여러가지를 만들 수 있고, 뒤로갈수록 AI를 더 잘 사용하는거 같아서 좋았다.</blockquote>
    </figure>
    <figure class="quote non" data-g="non">
      <figcaption><span class="pill">Non AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>아이디어를 생각할때 나만 생각하는 것이 아니라 이것을 하는 상대가 어떻게 생각할지 생각해보면 더 좋은 아이디어를 낼 수 있다. 그리고 기록할때 **,## 이것을 사용하면 깔끔하게 기록할 수 있다. 또한 문제 해결을 할 떄 친구들의 생각을 사용하면서 같이 해결하면 더 빨리 쉽게 해결할 수 있다는 것 또한 배웠다</blockquote>
    </figure>
    <figure class="quote non" data-g="non">
      <figcaption><span class="pill">Non AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>일단 팀원과 의견이 아주 많이 다른것은 당연하다고 생각합니다 그래서 저는 거기서 어떻게 하면 자세하고 정밀하게 소통을 해서 좋은 결과가 나올까 하면서 사소한 의견까지 서로 말하면서 한거 같습니다 프로젝트 아이디어를 생각하니 우리의 진로를 그림판으 비교해서 점점 다양한 기능을 추가하여 다향하게 그림을 그리는 방법을 추가하고 그리고 더욱더 많은 색깔을 추가하면 더욱더 넓은 선택지가 생겨지고 그것을 우리 진로의 빗대어 하면서 정말 재밌게 한거 같다라고 생각했다</blockquote>
    </figure>
    <figure class="quote on" data-g="on">
      <figcaption><span class="pill">On AI</span><span class="badge">AI를 쓰며 느낀 것</span></figcaption>
      <blockquote>이제 컴퓨터 프로그래머는 정말로 사라질 것 같은 직업이란 생각이 들었다. 이렇게 간단하게 배운 일반인도 ai를 활용하여 쉽게 만드니 정말 위험하다고 느꼈다.</blockquote>
    </figure>
    <figure class="quote on" data-g="on">
      <figcaption><span class="pill">On AI</span><span class="badge">AI를 쓰며 느낀 것</span></figcaption>
      <blockquote>AI를 활용하는데 복사 해서 붙여넣기 하니 자꾸 오류가 떠서 여러번 물어봐야 했습니다. 그래서 AI를 활용할 때는 여러번 물어보며 확인을 하고 AI에게 의존하는 것이 아니라 스스로 여러번 검토를 하고 ○○을 해야 하는 것이 중요하다고 느꼈습니다.</blockquote>
    </figure>
    <figure class="quote non" data-g="non">
      <figcaption><span class="pill">Non AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>compound라는 묶는 함수로 코드들을 묶어서 적용할 수 있게 되었고 , axis라는 축을 만드는 함수로 도형의 축의 위치를 조정할 수 있게 되었고, cylinder라는 원기둥을 만드는 함수로 도형 원기둥을 만들수 있게되었다 , length라는 길이를 조절하는 함수로 도형의 길이를 만들 수 있게 되었다. 수행평가를 하는동안 이러한 코드를 새롭게 배웠고 다른 것을 만들때도 적용할수 있는 실용성있는 경험이 되었다.</blockquote>
    </figure>
    <figure class="quote non" data-g="non">
      <figcaption><span class="pill">Non AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>같이 협동해서 만드니까 재밌었고 다 만들고 나니 귀여웠다</blockquote>
    </figure>
    <figure class="quote non" data-g="non">
      <figcaption><span class="pill">Non AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>수업 시간에 배워도 잘 이해가 안되었던 부분을 정확히 알게 되었고, compound를 확실히 이해하게 되었다. 하고 싶은 것은 엄청 거대한데도 그 정도의 실력이 아니면 그렇게 만들지 못 한다는 것을 깨닫게 되었다. 앞으로 내가 하고 싶은 것을 하려면 엄청난 노력으로 실력을 키워야겠다고 생각하게 되었다. 오류를 고치면서 잘 몰랐던 것도 알게되어 재미있었다. 친구와 안맞을 때도 있었지만 타협점을 찾아 이 결과물로 만들 수 있게 되었다. 재미있었던 수행이었다.</blockquote>
    </figure>
    <figure class="quote on" data-g="on">
      <figcaption><span class="pill">On AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>이번 프로젝트를 진행하며 데이터를 단순히 수집하는 것보다 그 의미를 이해하고 해석하는 과정이 중요하다는 것을 배웠다. 특히 독감 데이터를 분석하는 과정에서 자료가 무엇을 나타내는지 확인하고 적절하게 활용하기 위해 고민하면서 데이터를 비판적으로 바라보는 태도를 기를 수 있었다. 또한 정보를 효과적으로 전달하는 능력의 중요성도 느낄 수 있었다. 무엇보다 생명과학과 의료분야에 관심이 있는 나에게 이번 프로젝트는 질병 데이터를 직접 분석해 볼 수 있었던 의미 있는 경험이었다.</blockquote>
    </figure>
    <figure class="quote non" data-g="non">
      <figcaption><span class="pill">Non AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>지금까지 배웟던 코드들을 다시 복습하기도 하고 새로운 코드를 배울수 있던점이 인상깊었다</blockquote>
    </figure>
    <figure class="quote non" data-g="non">
      <figcaption><span class="pill">Non AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>일단 가장 고마운 건 ○○이가 제 의견을 반영해줘서 만들 수 있었으니까 그게 제일 고마웠고, 아이디어는 제 아이디어도 있었지만 ○○이 아이디어도 추가해서 되게 잘 만들 수 있었던 거 같아요!! 문제해결 과정은 코딩 책을 보거나 선생님의 도움을 받아 해결할 수 있어서 감사했고 기록 과정은 중간중간 제가 실수로 저장을 안 하고 날린 적이 있어서..ㅎㅎ 그거는 조금 반성해야 될 거 같아요..</blockquote>
    </figure>
    <figure class="quote on" data-g="on">
      <figcaption><span class="pill">On AI</span><span class="badge">AI를 쓰며 느낀 것</span></figcaption>
      <blockquote>인공지능을 활용하면서 조금 답답한 부분도 없지 않아 있었지만,, 결국 다 내가 설명을 잘 못한 탓이라고 생각이 든다ㅠㅠ 정말 인공지능을 잘 활용하려면 나의 어휘력도 굉장히 중요한 것 같다! 근데 진짜 인공지능 정말 똑똑이 같당ㅎ</blockquote>
    </figure>
    <figure class="quote non" data-g="non">
      <figcaption><span class="pill">Non AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>진짜 기타와 비슷하게 만들려고 노력을 하다보니 다른 코드를 짤 때 보다 기타 모양을 만드는 것이 더 오래 걸렸다는 것이 신기했고 내가 직접 기타를 만들어서 기타에 프로그래밍을 했다는 것이 뿌듯했다. 처음에 책에 있는 것을 바탕으로 기타 줄의 색을 바꾸게 하는 것을 시도했을 때 기타줄이 아예 나오지 않거나 색이 나오지 않았지만 코드들의 위치를 바꾸고 오류라고 뜰 때 나오는 글을 보고 고치다 보니 문제가 해결이 되었다.</blockquote>
    </figure>
    <figure class="quote on" data-g="on">
      <figcaption><span class="pill">On AI</span><span class="badge">AI를 쓰며 느낀 것</span></figcaption>
      <blockquote>chatgpt,gemini 가 뭔가 문제가 좀 많아진것같은 느낌을 받았습니다 gemini는 최근에 새로운 모델에서 멍청해지는 현상이 있다고 들어서 대략적으로 인지는 하고있었는데, chatgpt는 따로 들리는 이야기가 없어서 괜찮을줄알았는데, 프롬포트에 대한 답변 퀄리티가 많이 떨어진것같았습니다. 이에 반해 claude 에서는 충격받은점이 있습니다 웹사이트를 완성하고 read me 를 작성할때 claude에 &#x27;지금까지의 대화내역을 기반으로 리드 미 를 작성해줘&#x27; 라 했는데 데이터 전처리에 대한 대화내역이 없음에도 전처리 했다는내용이 들어가있어서 신선한 충격으로 다가왔습니다. 그래서 이번 프로젝트를 진행하는동안에는 claude 가 정말 탑이라는 생각이들었습니다.</blockquote>
    </figure>
    <figure class="quote on" data-g="on">
      <figcaption><span class="pill">On AI</span><span class="badge">AI를 쓰며 느낀 것</span></figcaption>
      <blockquote>AI를 활용하니 나 혼자서라면 할 수 없는 복잡한 코드를 빠르게 작성할 수 있었고, 또 프로젝트의 전체적인 틀을 만드는 시간도 아주 줄일 수 있었다. 하지만 AI가 제공하는 내용이 항상 정확한 것은 아니어서, 실제 데이터와 맞지 않는 부분이나 잘못된 설명이 있는 경우도 확인할 수 있었다. 그래서 AI의 답변을 그대로 사용하는 것이 아니라 직접 검증하고 ○○하는 과정이 반드시 필요하다는 점을 배웠다. 특히 공학 분야에서도 AI는 설계와 분석을 도와주는 좋은 도구가 될 수 있지만, 판단 과정에서는 사람의 이해와 검토가 필요하다고 느꼈다. 이번 활동을 통해 AI를 단순히 답을 알려주는 프로그램이 아니라 작업 효율을 높여 주는 도구로 활용하는 방법을 익힐 수 있었고, 앞으로도 필요한 부분에서는 적극적으로 활용하면서도, 결과를 스스로 확인하는 습관을 가져야겠다고 생각했다.</blockquote>
    </figure>
    <figure class="quote non" data-g="non">
      <figcaption><span class="pill">Non AI</span><span class="badge">만들며 배운 것</span></figcaption>
      <blockquote>자유낙하 코드를 몰랐는데 자유낙하 코드를 책을 보고 이해할수있었다 또 compound도 처음 사용해봤는데 구들이 하나로 모여서 위치를 설정할수있어서 더 편리하게 코딩할수있었다 그리고 계란이 없어지는 코드도 몰라서 선생님께 물어봐서 해결할수있었다</blockquote>
    </figure>
    <figure class="quote on" data-g="on">
      <figcaption><span class="pill">On AI</span><span class="badge">AI를 쓰며 느낀 것</span></figcaption>
      <blockquote>AI는 질문이 자세하고 좋을수록 더 좋은 답변을 준다는것을 알게되고 쓸모가 많다는고 느꼈다.</blockquote>
    </figure>
